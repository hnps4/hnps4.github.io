name: Automated Testing with Debian Server & Tmate

on:
  workflow_dispatch: # Memungkinkan pemicuan manual

jobs:
  debian-test-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Jalankan container Debian Server di background
      - name: Start Debian Server App
        run: |
          docker run -d -p 6080:6080 --name myapp ibagus/xfce-novnc:latest sh -c \
            "apt-get update && apt-get install -y netcat-openbsd && \
             echo -e 'HTTP/1.1 200 OK\n\nHello from Debian Server in GitHub Actions!' > response.txt && \
             while true; do cat response.txt | nc -l -p 6080; done"

      # 2. Jalankan Cloudflare Tunnel untuk mengekspos port 6080 ke internet
      - name: Start Cloudflare Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # Jalankan tunnel di background
          cloudflared tunnel --url http://localhost:6080 > cloudflared.log 2>&1 &
          
          # Tunggu proses tunnel siap dan dapatkan URL yang valid
          echo "Menunggu Cloudflare Tunnel membuat koneksi..."
          TUNNEL_URL=""
          for i in {1..30}; do
            # Regex diperbarui agar memastikan akhiran .trycloudflare.com ditangkap utuh
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cloudflared.log | head -n 1 || true)
            
            # Verifikasi bahwa URL terdeteksi dan tidak terpotong
            if [[ -n "$TUNNEL_URL" && "$TUNNEL_URL" == *.trycloudflare.com ]]; then
              break
            fi
            sleep 1
          done

          # Beri jeda 2 detik ekstra agar DNS propagates secara global
          sleep 2

          # Jika URL gagal didapatkan, hentikan workflow dan tampilkan log
          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Gagal mendapatkan URL Cloudflare Tunnel!"
            echo "--- ISI LOG CLOUDFLARED ---"
            cat cloudflared.log
            exit 1
          fi
          
          echo "=============================================="
          echo "URL AKSES PUBLIK ANDA: $TUNNEL_URL"
          echo "=============================================="
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      # 3. Langkah pengujian otomatis
      # - name: Execute Automated Tests
      #   run: |
      #     URL="${{ steps.tunnel.outputs.tunnel_url }}"
      #     echo "Menjalankan tes ke URL: $URL"
      #     curl -sS "$URL"

      # 4. Sesi TMATE untuk Debugging Interaktif
      - name: Setup tmate session for live debugging
        uses: mxschmitt/action-tmate@v3
