name: Automated Testing with Debian & Tmate

on:
  workflow_dispatch:

jobs:
  debian-test-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Jalankan Container dan Tunggu noVNC Siap
      - name: Start XFCE noVNC App & Verify Connection
        run: |
          # A. Jalankan container secara normal (TANPA sleep infinity atau override bash)
          # Ini akan membiarkan entrypoint bawaan image menjalankan XFCE dan noVNC
          docker run -d -p 6080:6080 --name myapp ibagus/xfce-novnc:latest
          
          # B. Validasi: Pastikan service noVNC bawaan sudah menyala dan bisa diakses
          echo "Menunggu noVNC bawaan merespon di localhost..."
          for i in {1..30}; do
            # Cek koneksi HTTP lokal. Jika noVNC sudah up, curl akan berhasil.
            if curl -s http://127.0.0.1:6080 > /dev/null; then
              echo "✅ BERHASIL! Service noVNC di port 6080 sudah merespon secara lokal."
              break
            fi
            echo "Menunggu service siap... ($i/30)"
            sleep 2
          done

      # 2. Jalankan Cloudflare Tunnel
      - name: Start Cloudflare Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # Jalankan tunnel mengarah ke port lokal yang sudah terverifikasi di Langkah 1
          cloudflared tunnel --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &
          
          echo "Menunggu Cloudflare Tunnel membuat koneksi publik..."
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cloudflared.log | head -n 1 || true)
            if [[ -n "$TUNNEL_URL" && "$TUNNEL_URL" == *.trycloudflare.com ]]; then
              break
            fi
            sleep 1
          done

          # Beri ekstra waktu 3 detik agar DNS Cloudflare menyebar secara global
          sleep 3
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Gagal mendapatkan URL Cloudflare Tunnel!"
            cat cloudflared.log
            exit 1
          fi
          
          echo "=============================================="
          echo "URL AKSES PUBLIK ANDA: $TUNNEL_URL"
          echo "=============================================="
          echo "Buka URL di atas, lalu tambahkan /vnc.html di belakangnya jika diperlukan."
          echo "=============================================="
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      # 3. Sesi TMATE untuk Debugging Interaktif
      - name: Setup tmate session for live debugging
        uses: mxschmitt/action-tmate@v3
