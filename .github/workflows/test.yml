name: Automated Testing with Debian Server & Tmate

on:
  workflow_dispatch: # Memungkinkan pemicuan manual

jobs:
  debian-test-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Jalankan container Debian Server di background
      - name: Start Debian Server App
        run: |
          docker run -d -p 6080:6080 --name myapp debian:bookworm-slim sh -c \
            "apt-get update && apt-get install -y netcat-openbsd && \
             echo -e 'HTTP/1.1 200 OK\nContent-Type: text/plain\nContent-Length: 39\n\nHello from Debian Server in Actions!' > response.txt && \
             while true; do cat response.txt | nc -l -p 6080; done"

          # TUNGGU hingga port 6080 benar-benar aktif di localhost
          echo "Menunggu aplikasi siap di port 6080..."
          for i in {1..20}; do
            if nc -z localhost 6080; then
              echo "Aplikasi di port 6080 SIAP!"
              break
            fi
            sleep 1
          done

      # 2. Jalankan Cloudflare Tunnel
      - name: Start Cloudflare Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # Gunakan 127.0.0.1 alih-alih localhost untuk menghindari isu IPv6/IPv4 binding
          cloudflared tunnel --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &
          
          echo "Menunggu Cloudflare Tunnel membuat koneksi..."
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cloudflared.log | head -n 1 || true)
            if [[ -n "$TUNNEL_URL" && "$TUNNEL_URL" == *.trycloudflare.com ]]; then
              break
            fi
            sleep 1
          done

          sleep 2

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Gagal mendapatkan URL Cloudflare Tunnel!"
            cat cloudflared.log
            exit 1
          fi
          
          echo "=============================================="
          echo "URL AKSES PUBLIK ANDA: $TUNNEL_URL"
          echo "=============================================="
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      # 3. Langkah pengujian otomatis
      # - name: Execute Automated Tests
      #   run: |
      #     URL="${{ steps.tunnel.outputs.tunnel_url }}"
      #     echo "Menjalankan tes ke URL: $URL"
      #     curl -sS "$URL"

      # 4. Sesi TMATE untuk Debugging Interaktif
      - name: Setup tmate session for live debugging
        uses: mxschmitt/action-tmate@v3
